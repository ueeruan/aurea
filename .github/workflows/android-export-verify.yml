name: Verify Android serial export
on:
  workflow_dispatch:
  push:
    branches: ['codex/keyflow-export2154']
    paths: ['.github/workflows/android-export-verify.yml']
permissions:
  contents: read
concurrency:
  group: android-export-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-editing:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [x86_64]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'cmake;3.22.1' 'ndk;28.2.13676358'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/app/.cxx
          key: android-native-${{ matrix.abi }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            android-native-${{ matrix.abi }}-${{ runner.os }}-
            android-${{ matrix.abi }}-${{ runner.os }}-
      - name: Enable KVM
        if: matrix.abi == 'x86_64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build isolated test app
        working-directory: android
        run: |
          bash gradlew :app:assembleUiTest :app:assembleUiTestAndroidTest -PaureaAbi=${{ matrix.abi }} --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8'
      - name: Run native editing regressions
        if: matrix.abi == 'x86_64'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          disable-animations: true
          script: |
            adb install -r build/android/app/outputs/apk/uiTest/app-uiTest.apk
            adb install -r build/android/app/outputs/apk/androidTest/uiTest/app-uiTest-androidTest.apk
            adb logcat -c
            adb shell am instrument -w -e aureaExportDeadlineSeconds 600 -e class com.aurea.aurea.editor.KeyflowExportDeviceTest com.aurea.aurea.uitest.test/androidx.test.runner.AndroidJUnitRunner > build/native-editing.log
            adb logcat -d -v threadtime > build/native-engine.log
            cat build/native-editing.log
            adb exec-out run-as com.aurea.aurea.uitest tar -cf - -C files keyflow-simple-text.mp4 keyflow-simple-text-progress.txt keyflow-animated-text-1080.mp4 keyflow-animated-text-1080-progress.txt keyflow-text-360.mp4 keyflow-text-360-progress.txt keyflow-text-720.mp4 keyflow-text-720-progress.txt keyflow-text-1080.mp4 keyflow-text-1080-progress.txt keyflow-text-360-repeat.mp4 keyflow-text-360-repeat-progress.txt keyflow-video-text-360.mp4 keyflow-video-text-360-progress.txt keyflow-video-text-720.mp4 keyflow-video-text-720-progress.txt > build/native-editing-files.tar
            grep -Eq '^OK \([0-9]+ tests?\)' build/native-editing.log
      - uses: actions/upload-artifact@v4
        if: always() && matrix.abi == 'x86_64'
        with:
          name: android-native-editing
          path: |
            build/native-editing.log
            build/native-engine.log
            build/native-editing-files.tar
      - name: Preserve ARM64 tests for the connected phone
        if: matrix.abi == 'arm64-v8a'
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-arm64-v8a
          path: |
            build/android/app/outputs/apk/uiTest/app-uiTest.apk
            build/android/app/outputs/apk/androidTest/uiTest/app-uiTest-androidTest.apk
          if-no-files-found: error
