name: Build native IPA (unsigned)
on:
  workflow_dispatch:
    inputs:
      run_simulator:
        description: 'Run simulator parity and gestures in addition to packaging the IPA'
        required: false
        default: true
        type: boolean
      capture_scenes:
        description: 'Optional comma-separated capture scenes; empty runs the full matrix'
        required: false
        default: ''
        type: string
      capture_only:
        description: 'Retest simulator captures only, without regenerating the IPA or repeating gestures'
        required: false
        default: false
        type: boolean
      skip_ipa:
        description: 'Run simulator validation without rebuilding an already verified IPA'
        required: false
        default: false
        type: boolean
      gesture_tests:
        description: 'Optional comma-separated XCTest method names; empty runs the full gesture suite'
        required: false
        default: ''
        type: string
  push:
    branches: ['codex/native-beta2-ipa']
    paths: ['engine/**', '.github/workflows/build-ipa.yml']
concurrency:
  group: native-ipa-${{ github.ref }}${{ inputs.capture_only && '-capture' || '' }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-ipa:
    if: github.event_name != 'workflow_dispatch' || (!inputs.capture_only && !inputs.skip_ipa)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      # O IronSource (LevelPlay 9.6.0) vem compilado com Swift 6.2: so linka com o
      # Xcode 26 (no 16.4 faltam isIsolatingCurrentContext e swift_coroFrameAlloc).
      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "Xcode 26 nao instalado no runner"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - name: Validate native integration and shared Android resources
        run: |
          python3 engine/platform/ios/verify/check_pbxproj.py
          python3 engine/platform/ios/verify/check_api_swift.py
          python3 tools/_ios_check.py tipos
          python3 engine/platform/ios/verify/check_shared_assets.py
          python3 engine/platform/ios/verify/check_effect_contract.py
          python3 engine/platform/ios/verify/check_metal_frag_outputs.py
          python3 engine/platform/ios/verify/check_editor_layout.py
          python3 engine/platform/ios/verify/check_preview_buffer.py
          python3 engine/platform/ios/verify/check_ai_sessions.py
          python3 engine/platform/ios/verify/check_project_lifecycle.py
          python3 engine/platform/ios/verify/check_scene_drag.py
          python3 engine/platform/ios/verify/check_memory_pressure.py
          python3 engine/platform/ios/verify/check_motion_blur.py
      - name: Install shader tools
        run: brew install cmake ninja shaderc ccache
      - name: Verify Apple stereo audio and sample-rate conversion
        run: |
          mkdir -p build
          clang++ -std=c++20 -fobjc-arc -framework AVFoundation -framework AudioToolbox \
            -I engine/include engine/platform/ios/verify/check_audio.mm -o build/check-audio
          build/check-audio
      - name: Verify Metal terminal frame ownership
        run: |
          clang++ -std=c++20 -fobjc-arc -framework Foundation -framework Metal \
            -I engine/include -I engine/gpu/metal \
            engine/platform/ios/verify/check_metal_frame_completion.mm -o build/check-metal-frame-completion
          build/check-metal-frame-completion
      - uses: actions/cache/restore@v4
        with:
          path: build/ccache
          key: ios-cxx-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ios-cxx-${{ runner.os }}-
      - name: Build Metal shader translator
        run: |
          cmake -S engine/tools/metal-shaders -B build/metal-tools -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/metal-tools --parallel 3
          echo "AUREA_METAL_COMPILER=$GITHUB_WORKSPACE/build/metal-tools/aurea-metal-compiler" >> "$GITHUB_ENV"
      - name: Compile native iOS app
        run: |
          set -o pipefail
          xcodebuild -project engine/platform/ios/Aurea.xcodeproj -scheme Aurea \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build-ios.log
      - name: Validate compiled app with Foundation
        run: swift engine/platform/ios/verify/check_bundle.swift build/ios/Build/Products/Release-iphoneos/Aurea.app
      - name: Validate shaders with Apple Metal compiler
        run: |
          set -o pipefail
          python3 engine/tools/metal-shaders/verify_msl.py engine/platform/ios/build/core/aurea-engine/generated/shaders 2>&1 | tee build-metal.log
      - name: Package IPA for sideloading
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/Aurea.app build/ipa/Payload/
          cd build/ipa
          zip -qr Aurea-0.1.0-2155-export-correcao-unsigned.ipa Payload
      - name: Validate packaged IPA
        run: python3 engine/platform/ios/verify/check_ipa.py build/ipa/Aurea-0.1.0-2155-export-correcao-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: aurea-ipa
          path: build/ipa/*.ipa
          if-no-files-found: error
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: |
            build-ios.log
            build-metal.log
          if-no-files-found: ignore
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: build/ccache
          key: ios-cxx-${{ runner.os }}-${{ github.run_id }}
  simulator-parity:
    if: github.event_name != 'workflow_dispatch' || inputs.run_simulator
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      # O IronSource (LevelPlay 9.6.0) vem compilado com Swift 6.2: so linka com o
      # Xcode 26 (no 16.4 faltam isIsolatingCurrentContext e swift_coroFrameAlloc).
      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "Xcode 26 nao instalado no runner"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - run: brew install cmake ninja shaderc ccache
      - uses: actions/cache/restore@v4
        with:
          path: build/ccache
          key: ios-simulator-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ios-simulator-${{ runner.os }}-
      - name: Build simulator shader translator
        run: |
          cmake -S engine/tools/metal-shaders -B build/metal-tools -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/metal-tools --parallel 3
          echo "AUREA_METAL_COMPILER=$GITHUB_WORKSPACE/build/metal-tools/aurea-metal-compiler" >> "$GITHUB_ENV"
      - name: Compile simulator application
        id: compile_simulator
        run: |
          set -o pipefail
          xcodebuild -project engine/platform/ios/Aurea.xcodeproj -scheme Aurea \
            -configuration Debug -sdk iphonesimulator ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build-simulator.log
      - name: Capture actual iOS UI and core fixture projects
        env:
          AUREA_PARITY_SCENES: ${{ inputs.capture_scenes || '' }}
        run: python3 engine/platform/ios/verify/capture_simulator.py build/simulator/Build/Products/Debug-iphonesimulator/Aurea.app build/ios-parity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-parity-screenshots
          path: |
            build/ios-parity/
            build-simulator.log
          if-no-files-found: ignore
      - name: Run native preview gestures and undo tests
        if: always() && steps.compile_simulator.outcome == 'success' && !inputs.capture_only
        env:
          GESTURE_TESTS: ${{ inputs.gesture_tests }}
        run: |
          set -o pipefail
          TEST_FLAGS=('-only-testing:AureaUITests/AureaStageGestureUITests')
          if [ -n "$GESTURE_TESTS" ]; then
            TEST_FLAGS=()
            IFS=',' read -r -a SELECTED_TESTS <<< "$GESTURE_TESTS"
            for TEST_NAME in "${SELECTED_TESTS[@]}"; do
              if [[ ! "$TEST_NAME" =~ ^test[A-Za-z0-9_]+$ ]]; then echo 'Invalid XCTest name'; exit 2; fi
              TEST_FLAGS+=("-only-testing:AureaUITests/AureaStageGestureUITests/$TEST_NAME")
            done
          fi
          SIMULATOR_UDID=$(python3 -c 'import json; print(json.load(open("build/ios-parity/manifest.json"))["device"]["udid"])')
          # Capture subsets may end on a scene that reinstalls the app without
          # decoder fixtures. The video gesture fixture verifies these files.
          APP_DATA=$(xcrun simctl get_app_container "$SIMULATOR_UDID" com.aurea.aurea data)
          mkdir -p "$APP_DATA/Documents"
          cp engine/tests/data/preview-bframes.mp4 engine/tests/data/preview-vfr.mp4 "$APP_DATA/Documents/"
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          python3 tools/playback_matrix.py --ffmpeg "$(command -v ffmpeg)" --output build/playback-matrix
          cp build/playback-matrix/*.mp4 "$APP_DATA/Documents/"
          python3 tools/verify_manual_editing_fixture.py
          cp engine/tests/data/manual-editing/manual-editing.aurea engine/tests/data/manual-editing/manual-motion.mp4 engine/tests/data/manual-editing/manual-rhythm.wav "$APP_DATA/Documents/"
          python3 engine/platform/ios/verify/run_gesture_tests.py build/ios-gesture-samples -- \
            xcodebuild test -project engine/platform/ios/Aurea.xcodeproj -scheme Aurea-Gestures \
            -configuration Debug -sdk iphonesimulator ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build/simulator -parallel-testing-enabled NO \
            "${TEST_FLAGS[@]}" \
            -resultBundlePath build/ios-gesture-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build-gesture-tests.log
      - name: Preserve native engine and export diagnostics
        if: always() && !inputs.capture_only
        run: |
          if [ -f build/ios-parity/manifest.json ]; then
            SIMULATOR_UDID=$(python3 -c 'import json; print(json.load(open("build/ios-parity/manifest.json"))["device"]["udid"])')
            xcrun simctl spawn "$SIMULATOR_UDID" log show --last 20m --style compact \
              --predicate 'subsystem == "com.aurea.aurea" OR process == "Aurea"' > build/ios-native-engine.log
          fi
      - name: Export native gesture attachments
        if: always() && !inputs.capture_only
        run: |
          if [ -d build/ios-gesture-tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/ios-gesture-tests.xcresult --output-path build/ios-gesture-attachments
          fi
      - name: Save compact native gesture screenshots
        if: always() && !inputs.capture_only
        uses: actions/upload-artifact@v4
        with:
          name: ios-gesture-screenshots
          path: |
            build/ios-gesture-attachments/
            build-gesture-tests.log
            build/ios-native-engine.log
          if-no-files-found: ignore
      - name: Save native gesture test diagnostics
        if: always() && !inputs.capture_only
        uses: actions/upload-artifact@v4
        with:
          name: ios-gesture-tests
          path: |
            build/ios-gesture-tests.xcresult/
            build/ios-gesture-samples/
            build/ios-gesture-attachments/
            build-gesture-tests.log
            build/ios-native-engine.log
          if-no-files-found: ignore
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: build/ccache
          key: ios-simulator-${{ runner.os }}-${{ github.run_id }}
