name: Build physical Android test packages
on:
  workflow_dispatch:
  push:
    branches: ['codex/beta-2146-compile']
    paths:
      - '.github/workflows/build-phone-tests.yml'
      - 'android/app/src/androidTest/java/com/aurea/aurea/editor/Particle3DMotionBlurExportTest.kt'
permissions:
  contents: read
concurrency:
  group: phone-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'cmake;3.22.1' 'ndk;28.2.13676358'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/app/.cxx
          key: phone-${{ matrix.abi }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: android-${{ matrix.abi }}-${{ runner.os }}-
      - name: Compile isolated physical-device app and tests
        working-directory: android
        run: |
          set -o pipefail
          bash gradlew :app:assembleUiTest :app:assembleUiTestAndroidTest -PaureaAbi=${{ matrix.abi }} --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' 2>&1 | tee ../build-phone.log
      - uses: actions/upload-artifact@v4
        with:
          name: phone-tests-${{ matrix.abi }}
          path: |
            build/android/app/outputs/apk/uiTest/app-uiTest.apk
            build/android/app/outputs/apk/androidTest/uiTest/app-uiTest-androidTest.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-test-diagnostics-${{ matrix.abi }}
          path: build-phone.log
