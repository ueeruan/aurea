name: Renderer migration (build validation)
on:
  workflow_dispatch:

jobs:
  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
          - os: macos-15
            target: ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
      - run: flutter pub get
      - name: Android ARM64 validation build
        if: matrix.target == 'android'
        run: |
          sed -i '/^org.gradle.java.home=/d' android/gradle.properties
          flutter build apk --debug --target-platform android-arm64 --dart-define=AUREA_FILAMENT=true
      - name: iOS Metal validation build (unsigned)
        if: matrix.target == 'ios'
        run: flutter build ios --release --no-codesign --dart-define=AUREA_FILAMENT=true
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-${{ matrix.target }}-validation
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/ios/iphoneos/Runner.app
          if-no-files-found: error
