org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Build mobile em uma plataforma por vez, com concorrencia limitada.
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ==================== O CACHE INCREMENTAL DO KOTLIN ====================
#
# O build do Android quebrava em `:file_picker:compileDebugKotlin` e
# `:image_picker_android:compileDebugKotlin` com
# "Could not close incremental caches ... Storage for [...tab] is already
# registered". NAO era o aviso de Built-in Kotlin (esse e so um aviso), e
# nao tinha relacao com o aurea_render: a build falhava igual sem ele.
#
# A causa e o cache incremental: o daemon do Kotlin memory-mapped os
# arquivos `.tab` num mapa GLOBAL e estatico (`FilePageCache`), e quando
# dois plugins que aplicam o KGP por conta propria compilam apontando para
# o mesmo caminho, o segundo registro estoura — e o fechamento do cache
# derruba a task.
#
# DESLIGAR O INCREMENTAL REMOVE O COMPONENTE QUE FALHA, e nao o recurso:
# quem compila continua sendo o mesmo Kotlin, com o mesmo codigo e as
# mesmas plugins. O preco e tempo de build em cada plugin, e nao
# funcionalidade — nada aqui desativa nada do app.
kotlin.incremental=false
