# =============================================================================
#  Propriedades do build.
# =============================================================================

# Memória do daemon. O motor C++ compila 18 arquivos com -O2 e templates
# pesados; 2 GB não bastam e o build morre com "Java heap space" no meio.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError

# Uma plataforma por vez, com concorrência limitada: compilar o motor C++ para
# quatro ABIs em paralelo satura a máquina e o ganho é negativo.
org.gradle.workers.max=2
org.gradle.parallel=false

# Cache de build ligado: o motor muda pouco e recompilar 18 arquivos a cada
# iteração de UI é o gargalo do ciclo de desenvolvimento.
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# O Aurea controla as ABIs em app/build.gradle.kts — o filtro precisa ser
# explícito, não herdado.
android.enableJetifier=false

kotlin.code.style=official
