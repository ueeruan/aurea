# A configuracao do servidor do mural.
#
# O `configurar.mjs` preenche o id do KV aqui embaixo sozinho — nao e
# preciso editar este arquivo a mao.

name = "mural-do-aurea"
main = "worker.js"

# A data trava o comportamento do runtime. Sem ela o Cloudflare recusa o
# deploy; com uma data fixa, uma mudanca futura da plataforma nao muda o
# que este servidor faz.
compatibility_date = "2026-09-01"

# Publicar no endereco workers.dev. Ja e o padrao, mas sem esta linha o
# wrangler avisa a cada deploy que esta decidindo sozinho — e um dia
# alguem le esse aviso e acha que ficou algo por configurar.
workers_dev = true

[[d1_databases]]
binding = "SOCIAL"
database_name = "aurea-social"
database_id = "fabc820e-ac53-4f1e-9967-fba57f01e307"

# O armazenamento. `binding` e o nome pelo qual o codigo enxerga o KV
# (env.MURAL), e `id` e qual KV da sua conta ele e.
[[kv_namespaces]]
binding = "MURAL"
id = "a4dbe25c9d6845e7814ae07052776fc0"

# A senha de moderacao NAO fica aqui. Ela entra por
# `npx wrangler secret put SENHA_DE_MODERACAO`, que guarda o valor no
# Cloudflare e nunca no repositorio. Segredo em arquivo versionado e
# segredo vazado.

# A TRANSCRICAO NA NUVEM (Groq Whisper). A chave da Groq NAO fica aqui:
# entra por `npx wrangler secret put GROQ_API_KEY`. O que fica aqui e o
# que pode mudar sem build novo do app — o modelo e as cotas. Mudou,
# `npx wrangler deploy`, e todo aparelho passa a usar o novo.
[vars]
MODELO_DE_TRANSCRICAO = "whisper-large-v3-turbo"
TRANSCRICOES_POR_HORA = "10"
TRANSCRICOES_POR_DIA = "30"
SEGUNDOS_DE_AUDIO_POR_DIA = "1800"
SEGUNDOS_DE_AUDIO_POR_DIA_TODOS = "36000"
