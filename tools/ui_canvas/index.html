<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUREA UI Canvas</title>
<style>
  :root { --bg:#0e0f12; --panel:#17191e; --line:#2a2d35; --text:#e8e6e1; --dim:#8b8f99; --gold:#d4a84b; --bad:#e2685f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45 system-ui, sans-serif; height:100vh; display:flex; overflow:hidden; }
  main { flex:1; display:flex; align-items:stretch; justify-content:center; gap:20px; padding:12px 16px 16px; min-width:0; }
  .screen { display:flex; flex-direction:column; align-items:center; gap:8px; min-width:0; }
  .label { display:flex; align-items:center; gap:8px; font-weight:600; white-space:nowrap; }
  .label .dot { width:8px; height:8px; border-radius:50%; background:var(--bad); }
  .label .dot.on { background:#5fd38a; }
  .label small { color:var(--dim); font-weight:400; }
  .phone { position:relative; flex:1; min-height:0; aspect-ratio:1080/2400; border:1px solid var(--line); border-radius:22px; overflow:hidden; background:#000; box-shadow:0 20px 60px #0008; }
  .phone img { width:100%; height:100%; display:block; user-select:none; -webkit-user-drag:none; cursor:crosshair; }
  .phone .msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; color:var(--dim); }
  .keys { display:flex; gap:6px; }
  button { background:#22252c; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:5px 12px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--gold); }
  aside { width:280px; border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; }
  header { padding:14px 16px; border-bottom:1px solid var(--line); }
  header b { color:var(--gold); letter-spacing:.08em; }
  .log { flex:1; overflow:auto; padding:12px 16px; }
  .log h3 { margin:0 0 4px; font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
  .log .now { font-size:15px; margin-bottom:14px; }
  .log ul { margin:0; padding-left:16px; color:var(--dim); }
  .log li { margin-bottom:6px; }
  footer { padding:10px 16px; border-top:1px solid var(--line); color:var(--dim); font-size:11px; }
  @media (max-width:900px) { aside { display:none; } }
</style>
</head>
<body>
<main id="screens"></main>
<aside>
  <header><b>AUREA</b> UI Canvas</header>
  <div class="log" id="log"></div>
  <footer>Clique = toque · arraste = deslizar · roda = rolar</footer>
</aside>
<script>
const screensEl = document.getElementById('screens'), log = document.getElementById('log');
const views = new Map();  // serial -> estado da tela
let layoutKey = '';

function post(body) { return fetch('/input', { method:'POST', body:JSON.stringify(body) }).catch(()=>{}); }
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c])); }

function buildScreen(def) {
  const v = { serial: def.serial || '', natW: 1080, natH: 2400, alive: true };
  const el = document.createElement('div');
  el.className = 'screen';
  el.innerHTML = `<div class="label"><span class="dot"></span>${esc(def.label || def.serial || 'Aparelho')}
      ${def.note ? `<small>${esc(def.note)}</small>` : ''}</div>
    <div class="phone"><img draggable="false" alt=""><div class="msg">Conectando…</div></div>
    <div class="keys"><button data-key="4">Voltar</button><button data-key="3">Início</button><button data-key="187">Recentes</button></div>`;
  const img = el.querySelector('img'), msg = el.querySelector('.msg'), dot = el.querySelector('.dot'), phone = el.querySelector('.phone');
  Object.assign(v, { el, img, msg, dot });

  const toDevice = e => { const r = img.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * v.natW, y: (e.clientY - r.top) / r.height * v.natH }; };
  // Próximo quadro só depois que o anterior carregou: sem fila, sem atraso acumulado.
  const next = () => {
    if (!v.alive) return;
    const probe = new Image();
    probe.onload = () => {
      img.src = probe.src; v.natW = probe.naturalWidth; v.natH = probe.naturalHeight;
      phone.style.aspectRatio = v.natW + '/' + v.natH;
      msg.style.display = 'none'; dot.classList.add('on'); setTimeout(next, 30);
    };
    probe.onerror = () => { dot.classList.remove('on'); msg.style.display = 'flex'; setTimeout(next, 1000); };
    probe.src = '/frame?s=' + encodeURIComponent(v.serial) + '&t=' + Date.now();
  };
  next();

  let down = null;
  img.addEventListener('pointerdown', e => { down = { ...toDevice(e), t: performance.now() }; img.setPointerCapture(e.pointerId); });
  img.addEventListener('pointerup', e => {
    if (!down) return;
    const up = toDevice(e), dist = Math.hypot(up.x - down.x, up.y - down.y);
    const ms = Math.max(80, Math.round(performance.now() - down.t));
    if (dist < 12) post({ s: v.serial, kind:'tap', x:up.x, y:up.y });
    else post({ s: v.serial, kind:'swipe', x1:down.x, y1:down.y, x2:up.x, y2:up.y, ms });
    down = null;
  });
  img.addEventListener('wheel', e => {
    e.preventDefault();
    const p = toDevice(e), dy = Math.sign(e.deltaY) * v.natH * 0.18;
    post({ s: v.serial, kind:'swipe', x1:p.x, y1:p.y, x2:p.x, y2:p.y - dy, ms:180 });
  }, { passive:false });
  el.querySelectorAll('[data-key]').forEach(b => b.onclick = () => post({ s: v.serial, kind:'key', code:b.dataset.key }));
  return v;
}

function layout(defs) {
  const key = JSON.stringify(defs);
  if (key === layoutKey) return;
  layoutKey = key;
  views.forEach(v => { v.alive = false; v.el.remove(); });
  views.clear();
  defs.forEach(d => { const v = buildScreen(d); views.set(v.serial, v); screensEl.appendChild(v.el); });
}

async function meta() {
  try {
    const m = await (await fetch('/meta')).json(), s = m.status || {};
    layout(s.screens?.length ? s.screens : [{ serial:'', label:'Aparelho' }]);
    views.forEach(v => { if (m.errs?.[v.serial]) v.msg.textContent = m.errs[v.serial]; });
    log.innerHTML = `<h3>Agora</h3><div class="now">${esc(s.now || '—')}</div>` +
      (s.changes?.length ? `<h3>Mudanças</h3><ul>${s.changes.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : '');
  } catch {}
  setTimeout(meta, 1500);
}
meta();
</script>
</body>
</html>
